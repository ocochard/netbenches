# sm2, packet generator and receiver of the 10G WireGuard bench.
#
# NOT driven by bench-lab.sh: the harness only uploads to the DUT. Applied by
# hand once and archived here so the two do not drift apart.
#
# sm2 sends on ix1 (switch10g VLAN 2, towards the DUT) and receives on ix0
# (VLAN 3, from the WireGuard peer). Two separate 10G ports, so the offered
# load and the returning load never share a port.

hostname="sm2"
harvest_mask="351"

# Management
ifconfig_igb0="inet 192.168.100.46/24"
ifconfig_igb0_ipv6="inet6 2a01:e0a:1092:3d20:dead:beef:0:46"
sshd_enable="yes"

# Bench ports. No address is strictly needed for netmap pkt-gen, which writes
# raw frames, but they make the node pingable for the lab checks and give the
# receiver side an address the peer can forward the decrypted traffic to.
# ix1 = VLAN 2, the generator -> DUT segment.
ifconfig_ix1="inet 198.18.0.46/24 -tso4 -tso6 -lro -vlanhwtso"
ifconfig_ix1_ipv6="inet6 2001:2::46 prefixlen 64"
# ix0 = VLAN 3, the peer -> receiver segment.
ifconfig_ix0="inet 198.19.0.46/24 -tso4 -tso6 -lro -vlanhwtso"
ifconfig_ix0_ipv6="inet6 2001:2:0:8000::46 prefixlen 64"

# The generator must NOT forward: it is an endpoint of the measurement, and
# forwarding here would let traffic take paths the bench does not intend.
gateway_enable="NO"
ipv6_gateway_enable="NO"
