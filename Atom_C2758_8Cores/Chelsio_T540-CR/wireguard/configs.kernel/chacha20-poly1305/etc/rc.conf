###### BSD Router Project Base Configuration ########

# /etc/rc.conf: This file, put your configuration here
# /etc/rc.conf.misc: Special BSDRP configuration parameters (polling, somes sysctl tunning)
# /etc/default/rc.conf: Default FreeBSD value and some examples (Do not edit this file!)

# Hostname
hostname="sm1"

# Disable INTERRUPT and ETHERNET from entropy sources
# This value has a major impact for 8 cores or more and allways improve performance
# http://blog.cochard.me/2015/09/receipt-for-building-10mpps-freebsd.html
harvest_mask="351"

# Management
ifconfig_igb0="inet 192.168.100.4/24"
ifconfig_igb0_ipv6="inet6 2a01:e0a:1092:3d20:dead:beef::4/64"
sshd_enable="yes"

# Kernel core dumps over the network to bigone, which runs netdumpd.
# nanobsd runs read-only with no swap, so there is no local dump device: a
# panic would otherwise leave no trace at all. -Z compresses, -c is this
# host (the client), -s is the netdumpd server.
#   cores land in bigone:/var/crash/
dumpdev="igb0"
dumpon_flags="-Z -c 192.168.100.4 -s 192.168.100.2"

# IPv4 router
# cxl1 faces the generator (switch10g VLAN 2), cxl0 the WireGuard peer (VLAN 3).
gateway_enable="YES"
ifconfig_cxl1="inet 198.18.0.4/24 -tso4 -tso6 -lro -vlanhwtso"
ifconfig_cxl0="inet 198.18.1.4/24 -tso4 -tso6 -lro -vlanhwtso"
static_routes="generator receiver"
route_generator="-net 198.18.0.0/16 198.18.0.46"
# The receiver prefix is reached through the peer's wg0 address, so the
# traffic can only leave encrypted. A tunnel that fails to come up leaves no
# route at all and the bench measures 0 instead of a wrong number.
route_receiver="-net 198.19.0.0/16 198.18.2.2"
# The generator sends from netmap and never answers ARP.
static_arp_pairs="generator"
static_arp_generator="198.18.0.46 90:e2:ba:84:20:39"

# IPv6 router
ipv6_gateway_enable="YES"
ipv6_activate_all_interfaces="YES"
ifconfig_cxl1_ipv6="inet6 2001:2::4 prefixlen 64"
ifconfig_cxl0_ipv6="inet6 2001:2:0:1::4 prefixlen 64"
ipv6_static_routes="generator receiver"
ipv6_route_generator="2001:2:: -prefixlen 49 2001:2::46"
ipv6_route_receiver="2001:2:0:8000:: -prefixlen 49 2001:2:0:2::2"
static_ndp_pairs="generator"
static_ndp_generator="2001:2::46 90:e2:ba:84:20:39"

# In-kernel WireGuard, if_wg(4).
#
# The key and the peer are NOT here: if_wg(4) takes them from wg(8) only, and
# "ifconfig wg0 create private-key ..." fails with "private-key: bad value"
# on FreeBSD 16. The configs/kernel set of this bench still uses that old
# create_args_wg0 syntax and no longer works. The keys live in /etc/wg0.conf,
# applied by /etc/rc.local.
#
# WireGuard has a single cipher suite (ChaCha20-Poly1305), fixed by the
# protocol: there is no cypher to choose, hence a single configuration set.
cloned_interfaces="wg0"
ifconfig_wg0="inet 198.18.2.4/24"
ifconfig_wg0_ipv6="inet6 2001:2:0:2::4 prefixlen 64"

kld_list="if_wg"
