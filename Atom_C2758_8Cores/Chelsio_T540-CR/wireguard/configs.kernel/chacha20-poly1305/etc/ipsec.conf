# Intentionally empty.
#
# bench-lab.sh uploads a configuration set with "scp -r", which copies files
# but never deletes them: anything left on the config partition by a previous
# bench survives. The ipsec bench of this machine installs an /etc/ipsec.conf
# with real SAD/SPD entries; shipping this file guarantees that one is
# overwritten instead of being carried into a WireGuard result.
#
# Not executed here: /etc/rc.d/ipsec has rcvar="ipsec_enable" and this set
# does not set it, so setkey is never run.
flush;
spdflush;
