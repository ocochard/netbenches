# In-kernel WireGuard, DUT side of the tunnel.
#
# if_wg(4) is configured by wg(8) only: "ifconfig wg0 create private-key ..."
# fails with "private-key: bad value" on FreeBSD 16. /etc/rc.local applies
# this file with "wg setconf".
#
# AllowedIPs must list the overlay prefixes too, not just the clear receiver
# prefixes: without them if_wg drops the inner packets as out-of-policy.
[Interface]
PrivateKey = qBa4CHnXUMoHRMByYG2aJkOp0+ZjAgBGvgGqbPA7GG8=
ListenPort = 51820

[Peer]
PublicKey = Nbr67G5q9RIGlri3hgw6UCJ2esNzX0cp1da8wlTaoBk=
Endpoint = 198.18.1.2:51820
AllowedIPs = 198.19.0.0/16, 2001:2:0:8000::/49, 198.18.2.0/24, 2001:2:0:2::/64
