flush;
spdflush;
# VTI mode: no spdadd, the if_ipsec(4) interface selects the SA by reqid.
# The null cypher still needs a non-empty key since FreeBSD 15
# (commit 04207850a9b9 rejects sadb_key_bits == 0); the key is ignored.
# AES-GCM keys are cypher key PLUS a 4 byte salt: 20 bytes for 128 bit and
# 36 for 256 bit. A wrong length installs no SA, setkey -f still exits 0, and
# the bench then measures nothing.

add 198.18.1.2 198.18.1.4 esp 0x1000 -m tunnel -u 100 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
add 198.18.1.4 198.18.1.2 esp 0x1001 -m tunnel -u 100 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
add 2001:2:0:1::2 2001:2:0:1::4 esp 0x1002 -m tunnel -u 100 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
add 2001:2:0:1::4 2001:2:0:1::2 esp 0x1003 -m tunnel -u 100 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
