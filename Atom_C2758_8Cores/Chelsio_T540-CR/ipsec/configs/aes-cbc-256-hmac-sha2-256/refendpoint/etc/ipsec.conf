flush;
spdflush;
# bigone, IPsec VTI peer. reqid 200 here, 100 on the DUT: reqid is a local
# binding between the if_ipsec interface and the SA, not negotiated.
# The IPv6 SAs bind to reqid 101 (201 on the peer), not the IPv4 reqid:
# if_ipsec(4) holds one outer address family per interface, so the IPv6 outer
# lives on a separate ipsec1 with its own reqid. Binding all four SAs to one
# reqid, as an earlier revision did, leaves the IPv6 pair unmatched and sends
# IPv6 inner traffic over the IPv4 tunnel instead.
add 198.18.1.2 198.18.1.4 esp 0x1000 -m tunnel -u 200 -E rijndael-cbc "12345678901234567890123456789012" -A hmac-sha2-256 "12345678901234567890123456789012";
add 198.18.1.4 198.18.1.2 esp 0x1001 -m tunnel -u 200 -E rijndael-cbc "12345678901234567890123456789012" -A hmac-sha2-256 "12345678901234567890123456789012";
add 2001:2:0:1::2 2001:2:0:1::4 esp 0x1002 -m tunnel -u 201 -E rijndael-cbc "12345678901234567890123456789012" -A hmac-sha2-256 "12345678901234567890123456789012";
add 2001:2:0:1::4 2001:2:0:1::2 esp 0x1003 -m tunnel -u 201 -E rijndael-cbc "12345678901234567890123456789012" -A hmac-sha2-256 "12345678901234567890123456789012";
