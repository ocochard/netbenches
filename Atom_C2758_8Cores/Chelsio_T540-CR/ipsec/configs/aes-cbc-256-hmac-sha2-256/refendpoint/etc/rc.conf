###### BSD Router Project Base Configuration ########
#
# IPsec VTI peer (reference endpoint) of the 10G bench: bigone.
#
# NOT UPLOADED BY THE HARNESS. bench-lab.sh only pushes a refendpoint/ when
# the configuration set contains BOTH dut/ and refendpoint/, and it reboots
# the peer between sets. bigone is not nanobsd (no /cfg, no "config save", so
# an uploaded file would not persist) and it is the lab's workstation, which
# must not be rebooted five times per address family. The set therefore ships
# dut/ only, and this file is the versioned record of what bigone must have.
#
# Apply the lines below by hand, merged into bigone's own /etc/rc.conf, and
# load the matching ../refendpoint/etc/ipsec.conf with "setkey -f".
#
# Each interface carries ONE direction, one VLAN per hop on switch10g:
#   ix0, VLAN 3: receives the ESP stream from the DUT
#   ix1, VLAN 4: transmits the decrypted stream to the receiver

ifconfig_ix0="inet 198.18.1.2/24 -tso4 -tso6 -lro"
ifconfig_ix0_ipv6="inet6 2001:2:0:1::2 prefixlen 64"
ifconfig_ix1="inet 198.19.0.2/24 -tso4 -tso6 -lro"
ifconfig_ix1_ipv6="inet6 2001:2:0:8000::2 prefixlen 64"

# The receiver runs its NIC in netmap mode and so answers neither ARP nor
# neighbour solicitations: both entries must be permanent or they expire
# mid-bench and forwarding stops. The static MAC entries on switch10g do NOT
# cover ARP/NDP, they only stop the switch forgetting which PORT a MAC is on.
static_arp_pairs="receiver"
static_arp_receiver="198.19.0.46 90:e2:ba:84:20:38"
static_ndp_pairs="receiver"
static_ndp_receiver="2001:2:0:8000::46 90:e2:ba:84:20:38"

gateway_enable="YES"
ipv6_gateway_enable="YES"

# equilibrium generates destinations in 198.19.10.0/24 and 2001:2:0:8010::/64,
# which the connected /24 on ix1 does NOT cover: without these routes the
# decrypted traffic matches bigone's default route and leaves on its internet
# tunnel, so the DUT encrypts normally and the bench measures nothing.
static_routes="generator receiver"
route_generator="-net 198.18.0.0/16 198.18.2.4"
route_receiver="-net 198.19.0.0/16 198.19.0.46"
ipv6_static_routes="generator receiver"
ipv6_route_generator="2001:2:: -prefixlen 49 2001:2:0:2::4"
ipv6_route_receiver="2001:2:0:8000:: -prefixlen 49 2001:2:0:8000::46"

# VTI peer side. reqid 200 here, 100 on the DUT: reqid is a local binding
# between the if_ipsec(4) interface and the SA, not negotiated on the wire.
cloned_interfaces="ipsec0"
create_args_ipsec0="reqid 200"
ifconfig_ipsec0="inet 198.18.2.2/24 198.18.2.4 tunnel 198.18.1.2 198.18.1.4"
ifconfig_ipsec0_ipv6="inet6 2001:2:0:2::2 prefixlen 64"
ipsec_enable="YES"
