flush;
spdflush;
# bigone, IPsec VTI peer. reqid 200 here, 100 on the DUT: reqid is a local
# binding between the if_ipsec interface and the SA, not negotiated.
add 198.18.1.2 198.18.1.4 esp 0x1000 -m tunnel -u 200 -E aes-gcm-16 "12345678901234567890";
add 198.18.1.4 198.18.1.2 esp 0x1001 -m tunnel -u 200 -E aes-gcm-16 "12345678901234567890";
add 2001:2:0:1::2 2001:2:0:1::4 esp 0x1002 -m tunnel -u 200 -E aes-gcm-16 "12345678901234567890";
add 2001:2:0:1::4 2001:2:0:1::2 esp 0x1003 -m tunnel -u 200 -E aes-gcm-16 "12345678901234567890";
