# In-kernel WireGuard, DUT side of the tunnel.
#
# if_wg(4) is configured by wg(8) only: "ifconfig wg0 create private-key ..."
# fails with "private-key: bad value" on FreeBSD 16. The pre-FreeBSD-14
# config sets of this bench passed the key and the peer as ifconfig create
# arguments; that interface is gone, so the keys live here and /etc/rc.local
# applies them with "wg setconf".
[Interface]
PrivateKey = 8Og1cCmvirK+zcGus/EyaA8aiFdzjjtS9GbuBa/bqFQ=
ListenPort = 51820

[Peer]
PublicKey = FSvVqj2s1FZqsSIvPLrE1RRTgbaPLbfG87P36F21M1g=
Endpoint = 198.18.1.203:51820
AllowedIPs = 198.19.0.0/16, 2001:2:0:8000::/49, 198.18.2.0/24, 2001:2:0:2::/64
