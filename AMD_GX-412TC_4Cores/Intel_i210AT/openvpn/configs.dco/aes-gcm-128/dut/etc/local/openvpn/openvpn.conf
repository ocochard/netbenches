client
dev tun
remote 198.18.1.203
ca ca.crt
cert APU2.crt
key APU2.key
# --ncp-disable is gone in OpenVPN 2.7: pin the data channel cipher with
# --data-ciphers so no negotiation can pick another one during the bench.
data-ciphers AES-128-GCM
data-ciphers-fallback AES-128-GCM
auth SHA1
cipher AES-128-GCM
fast-io
# DCO mode: the data channel is handled by the if_ovpn(4) kernel driver.
# if_ovpn only supports none, AES-GCM and CHACHA20-POLY1305 (see if_ovpn.c),
# which is why there is no AES-CBC set in this tree.
# (no --disable-dco here: let OpenVPN use DCO)

# bench-lab.sh reboots the OpenVPN server before every configuration set, so
# the client must survive losing its peer and reconnect on its own. Without
# these it gives up and the next bench measures nothing.
resolv-retry infinite
persist-key
persist-tun
connect-retry 1 10
