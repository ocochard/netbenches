# Intentionally empty.
#
# bench-lab.sh uploads a configuration set with "scp -r", which copies files
# but never deletes them: anything left on the config partition by a previous
# bench survives. The ipsec bench of this machine installs an /etc/ipsec.conf
# with 4 SAD/SPD entries; shipping this file guarantees that one is
# overwritten instead of being carried into an OpenVPN result.
#
# Note this file is NOT executed here: /etc/rc.d/ipsec has rcvar="ipsec_enable"
# and these config sets do not set it, so setkey is never run. The point is
# only to not keep stale policies on the config partition. The policies
# themselves are cleared by the reboot bench-lab.sh does between config sets.
flush;
spdflush;
