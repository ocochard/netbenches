flush;
spdflush;
# VTI mode: no spdadd, the if_ipsec(4) interface selects the SA by reqid.
# The null cipher still needs a non-empty key since FreeBSD 15
# (commit 04207850a9b9 rejects sadb_key_bits == 0); the key is ignored by the
# null transform.

add 198.18.1.203 198.18.1.205 esp 0x1000 -m tunnel -u 100 -E aes-gcm-16 "12345678901234567890";
add 198.18.1.205 198.18.1.203 esp 0x1001 -m tunnel -u 100 -E aes-gcm-16 "12345678901234567890";
add 2001:2:0:1::203 2001:2:0:1::205 esp 0x1002 -m tunnel -u 100 -E aes-gcm-16 "12345678901234567890";
add 2001:2:0:1::205 2001:2:0:1::203 esp 0x1003 -m tunnel -u 100 -E aes-gcm-16 "12345678901234567890";
