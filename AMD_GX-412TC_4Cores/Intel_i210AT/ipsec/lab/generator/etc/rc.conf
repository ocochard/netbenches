### Packet generator and receiver (sm1) for the APU2 IPsec bench
#
# This node is not driven by bench-lab.sh: the harness only uploads to the DUT
# and to the reference endpoint. Keep this file in sync by hand.
#
# Topology (see ../../bench-lab-3nodes.config for the full diagram):
#   sm1 igb1 ==> apu2-3 igb1 [DUT, encrypts] igb2 ==> sm2 igb1 [peer, decrypts]
#    ^                                                             |
#    +---------------- sm1 igb2 <=== sm2 igb2 <--------------------+

hostname="sm1"
ifconfig_igb0="inet 192.168.100.4/24"
ifconfig_igb0_ipv6="inet6 2a01:e0a:1092:3d20:dead:beef::4/64"

ntpdate_enable="YES"
ntpdate_hosts="192.168.100.1"
ntpdate_flags="-b"

# 10G link to sm2 disabled for this bench: 198.18.0.0/24 and 198.19.0.0/24 are
# needed on the igb ports facing the DUT, and having the same subnets on
# cxl0/cxl1 makes the kernel send the traffic over the 10G path, bypassing the
# DUT entirely. Restore from /etc/rc.conf.pre-ipsec-bench when the bench is over.
#ifconfig_cxl0="inet 198.18.0.4/24 -tso4 -tso6 -lro -vlanhwtso"
#ifconfig_cxl0_ipv6="inet6 2001:2::4/64"
#ifconfig_cxl1="inet 198.19.0.4/24 -tso4 -tso6 -lro -vlanhwtso"
#ifconfig_cxl1_ipv6="inet6 2001:2:0:8000::4/64"

# Packet generator (igb1) and receiver (igb2)
ifconfig_igb1="inet 198.18.0.203/24 -tso4 -tso6 -lro -vlanhwtso"
ifconfig_igb1_ipv6="inet6 2001:2::203 prefixlen 64"
ifconfig_igb2="inet 198.19.0.203/24 -tso4 -tso6 -lro -vlanhwtso"
ifconfig_igb2_ipv6="inet6 2001:2:0:8000::203 prefixlen 64"

gateway_enable="YES"
ipv6_gateway_enable="YES"

sshd_enable="yes"

# Both lab prefixes must be reached THROUGH THE DUT (198.18.0.205), so that the
# traffic enters the ESP tunnel. Pointing 198.19.0.0/16 at the peer's own
# address (198.19.0.201) instead makes the packets leave directly on igb2 and
# skip the tunnel, which silently measures nothing.
static_routes="generator receiver"
route_generator="-net 198.18.0.0/16 198.18.0.205"
route_receiver="-net 198.19.0.0/16 198.18.0.205"
static_arp_pairs="generator receiver"
static_arp_generator="198.18.0.205 00:0d:b9:45:7a:d5"
static_arp_receiver="198.19.0.201 0c:c4:7a:da:3c:12"

ipv6_static_routes="generator receiver"
ipv6_route_generator="2001:2:: -prefixlen 49 2001:2::205"
ipv6_route_receiver="2001:2:0:8000:: -prefixlen 49 2001:2::205"
static_ndp_pairs="generator receiver"
static_ndp_generator="2001:2::205 00:0d:b9:45:7a:d5"
static_ndp_receiver="2001:2:0:8000::201 0c:c4:7a:da:3c:12"

# pf must stay disabled: we bench IPsec, nothing else
pf_enable="NO"
pf_rules="/etc/pf.conf"
