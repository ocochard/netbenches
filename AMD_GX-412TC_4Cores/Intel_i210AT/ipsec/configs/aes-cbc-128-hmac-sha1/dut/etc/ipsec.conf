flush;
spdflush;
# VTI mode: no spdadd, the if_ipsec(4) interface selects the SA by reqid.
# The null cipher still needs a non-empty key since FreeBSD 15
# (commit 04207850a9b9 rejects sadb_key_bits == 0); the key is ignored by the
# null transform.

# The IPv6 SAs name the IPv6 outer pair and bind to ipsec1 (reqid 101), the
# IPv4 SAs to ipsec0 (reqid 100). Before this was split they all carried the
# same reqid, so the IPv6 SAs were never selected and the "IPv6" arm of the
# bench ran IPv6 inner packets over the IPv4 ESP tunnel.
add 198.18.1.203 198.18.1.205 esp 0x1000 -m tunnel -u 100 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
add 198.18.1.205 198.18.1.203 esp 0x1001 -m tunnel -u 100 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
add 2001:2:0:1::203 2001:2:0:1::205 esp 0x1002 -m tunnel -u 101 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
add 2001:2:0:1::205 2001:2:0:1::203 esp 0x1003 -m tunnel -u 101 -E rijndael-cbc "1234567890123456" -A hmac-sha1 "12345678901234567890";
