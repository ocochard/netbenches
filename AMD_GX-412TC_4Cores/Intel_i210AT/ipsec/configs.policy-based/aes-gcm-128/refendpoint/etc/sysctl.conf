# $FreeBSD: src/etc/sysctl.conf,v 1.8 2003/03/13 18:43:50 mux Exp $
#
#  This file is read when going to multi-user and its contents piped thru
#  ``sysctl'' to adjust kernel values.  ``man 5 sysctl.conf'' for details.
#

# Enabling fastforwarding by disabling ICMP redirect
net.inet.ip.redirect=0
net.inet6.ip6.redirect=0

# Enabling Tx abdicate
dev.igb.0.iflib.tx_abdicate=1
dev.igb.1.iflib.tx_abdicate=1
dev.igb.2.iflib.tx_abdicate=1
dev.igb.3.iflib.tx_abdicate=1

# Disable flow-control
dev.igb.0.fc=0
dev.igb.1.fc=0
dev.igb.2.fc=0
dev.igb.3.fc=0

# The reference endpoint must never be the bottleneck: with async_crypto=0 the
# decryption runs inline on the netisr thread and the ESP queue overflows
# (203520 dropped / 204218 in, measured on this Atom C2758). Async dispatch
# spreads it over the crypto worker threads.
# Do NOT set this on the DUT: it is a bench variable, see configs.vti.async_crypto/
net.inet.ipsec.async_crypto=1
